<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject | default("CivicPulse AI Notification") }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      background-color: #f1f5f9;
      padding: 24px 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 24px;
      color: #ffffff;
    }
    .brand-badge {
      display: inline-block;
      padding: 4px 8px;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .content {
      padding: 28px 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-critical { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    .badge-high { background-color: #ffedd5; color: #c2410c; border: 1px solid #fdba74; }
    .badge-medium { background-color: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
    .badge-low { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin: 18px 0;
    }
    .btn {
      display: inline-block;
      padding: 12px 20px;
      background-color: #2563eb;
      color: #ffffff !important;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      text-align: center;
      margin: 4px 2px;
    }
    .btn-emerald { background-color: #059669; }
    .btn-amber { background-color: #d97706; }
    .btn-red { background-color: #dc2626; }
    .btn-slate { background-color: #475569; }
    .footer {
      background-color: #f8fafc;
      padding: 18px 24px;
      font-size: 11px;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <span class="brand-badge">CivicPulse AI Desk</span>
        <h1>{% block header_title %}Accountability Dispatch{% endblock %}</h1>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        CivicPulse AI — Closed-Loop Civic Accountability Desk<br>
        Report • Route • Resolve • Verify
      </div>
    </div>
  </div>
</body>
</html>
